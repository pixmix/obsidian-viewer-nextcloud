services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nextcloud_root
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    volumes:
      - db_data:/var/lib/mysql

  nextcloud:
    image: nextcloud:31
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
    volumes:
      - nc_data:/var/www/html
      - ./custom_apps/obsidian_viewer:/var/www/html/custom_apps/obsidian_viewer
      - ./test_vault:/test_vault
    depends_on:
      - db

volumes:
  db_data:
  nc_data:
